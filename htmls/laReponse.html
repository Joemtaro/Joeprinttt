<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier Vide - JoePrint</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #333;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 400px;
    }

    .container i {
      font-size: 70px;
      color: #e67e22;
      margin-bottom: 20px;
    }

    .container h1 {
      font-size: 28px;
      color: #e67e22;
      margin-bottom: 10px;
    }

    .container p {
      font-size: 16px;
      margin-bottom: 30px;
      color: #555;
    }

    .container a {
      display: inline-block;
      background: #e67e22;
      color: white;
      padding: 15px 35px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 17px;
      transition: 0.3s;
    }

    .container a:hover {
      background: #cf6e0f;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
      color: white;
      font-size: 14px;
    }

    footer a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <i class="fa-solid fa-cart-shopping"></i>
    <h1>Votre panier est vide</h1>
    <p>Vous n’avez encore ajouté aucun produit. Découvrez nos services d’impression et commandez dès maintenant !</p>
    <a href="../htmls/Nos_services.html"><i class="fa-solid fa-plus"></i> Commencer mes achats</a>
  </div>

  <footer>
    © 2025 JoePrint
  </footer>

</body>
</html>
